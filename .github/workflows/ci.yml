name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The built frontend against the real API and a real database
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dvs
          POSTGRES_PASSWORD: dvs
          POSTGRES_DB: dvs_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dvs" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: development
      HUSKY: "0"
      DATABASE_URL: postgresql://dvs:dvs@localhost:5432/dvs_e2e
      JWT_SECRET: e2e-only-jwt-secret-not-used-anywhere-else-0123456789
      REFRESH_TOKEN_SECRET: e2e-only-refresh-secret-not-used-anywhere-else-012345
      CORS_ORIGINS: http://localhost:4173
      APP_URL: http://localhost:4173
      SEED_ADMIN_PASSWORD: e2e-admin-password-2026
      SEED_STORE_PASSWORD: e2e-store-password-2026
      E2E_ADMIN_PASSWORD: e2e-admin-password-2026
      E2E_STORE_PASSWORD: e2e-store-password-2026
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Database
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run db:seed
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # Known vulnerabilities in the packages that run in production
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  perception-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: perception-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: perception-service/requirements.txt
      # CPU-only torch keeps the CI install small; GPU builds are for deployment
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt opencv-python-headless
      - run: python -m pytest -q
