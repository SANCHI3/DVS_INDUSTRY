name: CCTV installer

# Every push builds and tests the installer. Only a manual run or a cctv-v* tag
# publishes one, because the plant PC installs whatever release is latest.
on:
  push:
    branches: [master]
    tags: ['cctv-v*']
    paths:
      - perception-service/**
      - .github/workflows/installer.yml
  workflow_dispatch:

permissions:
  contents: write

# A push may replace an older check, but nothing may cancel a release being published
concurrency:
  group: cctv-installer-${{ github.event_name == 'push' && github.ref_type == 'branch' && 'check' || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: NSIS
        run: choco install nsis -y --no-progress
      - name: Build
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DVS_VERSION: cctv-setup-${{ github.run_number }}
        run: |
          $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"
          ./perception-service/installer/build_windows.ps1
      - name: Install it the way the plant PC will
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath .\dvs-cctv-setup.exe -ArgumentList "/S"
          if (-not (Test-Path C:\dvs-cctv\python\pythonw.exe)) { throw "not installed" }
          if (-not (Test-Path C:\dvs-cctv\app\config\cameras.yaml)) { throw "no camera settings" }
      - name: End-to-end test with a fake DVR
        shell: pwsh
        run: |
          C:\dvs-cctv\python\python.exe C:\dvs-cctv\app\installer\ci_smoke_test.py
          if ($LASTEXITCODE) { throw "smoke test failed" }
      - name: Upgrade over the running copy, including failures
        shell: pwsh
        run: |
          python perception-service\installer\ci_upgrade_test.py dvs-cctv-setup.exe
          if ($LASTEXITCODE) { throw "upgrade test failed" }
          C:\dvs-cctv\python\python.exe -c "import cv2, torch; print('upgrade ok')"
          if ($LASTEXITCODE) { throw "python does not run after the upgrade" }
      - name: Update and roll back on the installed copy
        shell: pwsh
        run: |
          C:\dvs-cctv\python\python.exe C:\dvs-cctv\app\installer\ci_update_test.py update-package\dvs-cctv-app.zip
          if ($LASTEXITCODE) { throw "update test failed" }
      - name: Show the log after a failure
        if: failure()
        shell: pwsh
        run: |
          Get-Content C:\dvs-cctv\logs\install.log -Tail 60 -ErrorAction SilentlyContinue
          Get-Content C:\dvs-cctv\app\logs\perception.log -Tail 60 -ErrorAction SilentlyContinue
      - name: Publish
        if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || startsWith(github.ref, 'refs/tags/cctv-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "cctv-setup-${{ github.run_number }}"
          gh release create $tag dvs-cctv-setup.exe update-package\dvs-cctv-app.zip update-package\dvs-cctv-app.json --title "CCTV installer ${{ github.run_number }}" --notes "Windows installer for the plant CCTV PC." --latest
