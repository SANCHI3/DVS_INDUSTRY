name: CCTV installer

on:
  push:
    branches: [master]
    paths:
      - perception-service/**
      - .github/workflows/installer.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cctv-installer
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: NSIS
        run: choco install nsis -y --no-progress
      - name: Build
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DVS_VERSION: cctv-setup-${{ github.run_number }}
        run: |
          $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"
          ./perception-service/installer/build_windows.ps1
      - name: Install it the way the plant PC will
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath .\dvs-cctv-setup.exe -ArgumentList "/S"
          if (-not (Test-Path C:\dvs-cctv\python\pythonw.exe)) { throw "not installed" }
          if (-not (Test-Path C:\dvs-cctv\app\config\cameras.yaml)) { throw "no camera settings" }
      - name: End-to-end test with a fake DVR
        shell: pwsh
        run: |
          C:\dvs-cctv\python\python.exe C:\dvs-cctv\app\installer\ci_smoke_test.py
          if ($LASTEXITCODE) { throw "smoke test failed" }
      - name: Upgrade over the installed copy keeps the settings
        shell: pwsh
        run: |
          Add-Content C:\dvs-cctv\app\config\cameras.yaml "# plant edit"
          New-Item -ItemType Directory -Force C:\dvs-cctv\calibration\snapshots | Out-Null
          Set-Content C:\dvs-cctv\calibration\snapshots\keep.txt "keep"
          $files = "C:\dvs-cctv\app\.env", "C:\dvs-cctv\app\config\cameras.yaml", "C:\dvs-cctv\calibration\snapshots\keep.txt"
          $before = $files | ForEach-Object { (Get-FileHash $_).Hash }
          $access = (Get-Acl C:\dvs-cctv\app\.env).Sddl
          Start-Process -Wait -FilePath .\dvs-cctv-setup.exe -ArgumentList "/S"
          $after = $files | ForEach-Object { (Get-FileHash $_).Hash }
          if (Compare-Object $before $after) { throw "the upgrade changed the settings" }
          if ((Get-Acl C:\dvs-cctv\app\.env).Sddl -ne $access) { throw "the upgrade changed who can read .env" }
          C:\dvs-cctv\ffmpeg\bin\ffprobe.exe -version | Select-Object -First 1
          if ($LASTEXITCODE) { throw "ffprobe does not run after the upgrade" }
          C:\dvs-cctv\python\python.exe -c "import cv2, torch; print('upgrade ok')"
          if ($LASTEXITCODE) { throw "python does not run after the upgrade" }
      - name: Update and roll back on the installed copy
        shell: pwsh
        run: |
          C:\dvs-cctv\python\python.exe C:\dvs-cctv\app\installer\ci_update_test.py update-package\dvs-cctv-app.zip
          if ($LASTEXITCODE) { throw "update test failed" }
      - name: Show the log after a failure
        if: failure()
        shell: pwsh
        run: Get-Content C:\dvs-cctv\app\logs\perception.log -Tail 60 -ErrorAction SilentlyContinue
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "cctv-setup-${{ github.run_number }}"
          gh release create $tag dvs-cctv-setup.exe update-package\dvs-cctv-app.zip update-package\dvs-cctv-app.json --title "CCTV installer ${{ github.run_number }}" --notes "Windows installer for the plant CCTV PC." --latest
