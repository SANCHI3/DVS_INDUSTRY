# Factory CCTV: Hikvision DS-7208HGHI-SH, 8 analog channels (A1-A8).
#
# Stream addresses are built at runtime from the dvr: section and
# DVR_USERNAME / DVR_PASSWORD in perception-service/.env: the password never
# goes in this file, the logs, the database or the website.
#
# Per camera:
#   name / zone      what the website shows ("Camera 01 (Press shop)")
#   rules            which checks run here: fire (or fire_smoke), fall, crowd,
#                    fight, anomaly. E.g. leave crowd out at the gate.
#   fps              frames per second sent to the models (sub stream)
#   detect_stream    sub (low resolution, used for detection)
#   evidence_stream  main (full resolution, opened only for incident pictures)
#   zones            optional crowd areas (pixel polygons at the processing size)
#   roi              optional area to check, fractions of the picture (0-1):
#                      roi: [[0.05, 0.2], [0.95, 0.2], [0.95, 1.0], [0.05, 1.0]]
#   ignore_zones     optional areas to ignore (welding = fire look-alike, sunny window):
#                      - name: Welding bay
#                        polygon: [[0.6, 0.1], [0.9, 0.1], [0.9, 0.5], [0.6, 0.5]]
#                        events: [fire_smoke]          # leave out to ignore every check
#                    draw both on the camera's picture: python scripts/draw_roi.py <channel>
#   crowd_min_people people for a crowd here (default 8, thresholds.yaml)
#   thresholds       any thresholds.yaml values for this camera only
#   night_mode       normal (default) | strict | off: fire/smoke on black-and-white
#                    infrared pictures (see evaluation/night_ir_check.py)
#
# Run all enabled cameras:   python main.py --all --no-display
# One camera:                python main.py --camera dvr-ch1 --no-display

dvr:
  host: ${DVR_HOST:-192.168.0.105}    # DHCP: DVR_MAC finds it again if it moves
  rtsp_port: ${DVR_RTSP_PORT:-554}
  # hik_streaming, hik_h264 (scripts/probe_dvr.py says which) or dahua for CP PLUS
  url_format: ${DVR_URL_FORMAT:-hik_streaming}
  transport: tcp

defaults:
  enabled: true
  detect_stream: sub
  evidence_stream: main
  fps: 2    # shared server: see MAX_INFER_FPS_TOTAL and the CPU guard
  rules: [fire, fall, crowd, fight, anomaly]

cameras:
  # TODO(owner): for each channel, the real area (name) and zone (Press shop /
  # Store / Gate / Dispatch / Office ...) and which rules apply there, from the
  # pictures saved by scripts/grab_snapshots.py.
  - id: dvr-ch1
    channel: 1
    name: "Camera 01"
    zone: ""
  - id: dvr-ch2
    channel: 2
    name: "Camera 02"
    zone: ""
  - id: dvr-ch3
    channel: 3
    name: "Camera 03"
    zone: ""
  - id: dvr-ch4
    channel: 4
    name: "Camera 04"
    zone: ""
  - id: dvr-ch5
    channel: 5
    name: "Camera 05"
    zone: ""
  - id: dvr-ch6
    channel: 6
    name: "Camera 06"
    zone: ""
  - id: dvr-ch7
    channel: 7
    name: "Camera 07"
    zone: ""
  - id: dvr-ch8
    channel: 8
    name: "Camera 08"
    zone: ""

  # Webcam / video file for demos and tests (python main.py --demo, or
  # --camera CAM-01 --source clip.mp4). Never part of --all.
  - id: CAM-01
    name: "Demo camera"
    zone: "Demo"
    source: "0"
    enabled: false
