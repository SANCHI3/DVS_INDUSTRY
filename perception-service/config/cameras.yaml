# Camera and zone configuration.
# `source` can be:
#   - an integer string like "0" for a local webcam
#   - an RTSP URL like "rtsp://user:pass@ip:554/stream"
#   - a path to a video file (useful for testing without a real camera)
#
# Zones are defined as polygons in pixel coordinates of the *processing*
# resolution (see thresholds.yaml -> perception.process_width/height).
# Draw these by eye against a saved snapshot from the camera, or build a
# small helper script later to click points on a frame.
#
# Optional per-zone keys:
#   name: "Loading bay"         shown to staff in incident descriptions
#   loitering_seconds: 30       dwell before a lingering alert (default rules.loitering.dwell_seconds)
#   loitering: true/false       force lingering checks on/off for this zone
#   active_hours: "08:00-20:00" zone only raises alerts inside these hours (overnight ranges allowed)
#
# IMPORTANT: the z1/z2 polygons below are EXAMPLES covering whole thirds of
# the frame. Anyone sitting in the left third of a webcam view counts as
# "inside a restricted area" and will raise lingering alerts. Redraw them
# around the real restricted area before relying on lingering/intrusion alerts.
# main.py prints a warning at start-up for zones covering >= 25% of the view.

cameras:
  - id: CAM-01
    name: Demo Camera
    location: "Test Room"
    source: "0"               # webcam by default; swap for an RTSP URL or file path
    zones:
      - zone_id: z1
        type: restricted
        # example polygon covering the left third of a 640x480 frame
        polygon: [[0, 0], [200, 0], [200, 480], [0, 480]]
        active_hours: "00:00-23:59"   # always active for demo purposes
      - zone_id: z2
        type: ppe_required
        polygon: [[400, 0], [640, 0], [640, 480], [400, 480]]
