# Camera configuration.
# `source` can be:
#   - an integer string like "0" for a local webcam
#   - an RTSP URL like "rtsp://user:pass@ip:554/stream"
#   - a path to a video file (useful for testing without a real camera)
#
# `zones` is optional and only used by the crowd rule. Without zones, crowding
# is checked on the whole frame. To check one area only, add a polygon in
# pixel coordinates of the *processing* resolution (thresholds.yaml ->
# perception.process_width/height):
#   - zone_id: canteen
#     type: crowd
#     polygon: [[x1, y1], [x2, y2], [x3, y3], [x4, y4]]

cameras:
  - id: CAM-01
    name: Demo Camera
    location: "Test Room"
    source: "0"               # webcam by default; swap for an RTSP URL or file path
    zones: []
