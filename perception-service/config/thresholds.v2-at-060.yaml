perception:
  model_path: "yolov8n.pt"       # COCO-pretrained; swap for a fine-tuned checkpoint later
  process_width: 640
  process_height: 480
  detection_fps: 10               # target for fight sequences; benchmark on deployment GPU
  confidence_threshold: 0.35
  classes_of_interest: ["person", "car", "truck", "backpack", "handbag", "suitcase"]

tracking:
  track_activation_threshold: 0.25
  lost_track_buffer: 30           # frames a track can be "lost" before removal
  minimum_matching_threshold: 0.8

temporal_buffer:
  window_seconds: 30              # rolling history kept per track

rules:
  crowd:
    person_count_threshold: 3
    sustained_seconds: 5
  fall:
    aspect_ratio_flip_seconds: 1.5     # standing->fallen transition must happen within this
    stillness_seconds: 5                # time lying still before PROBABLE
    confirm_stillness_seconds: 8        # time lying still before CONFIRMED

confirmation:
  # number of positive evaluation windows out of the last N required per tier,
  # keyed by event_type. "default" applies to any event not explicitly listed.
  default:
    probable_hits: 2
    probable_window: 5
    confirmed_hits: 4
    confirmed_window: 5
  fall:
    probable_hits: 1
    probable_window: 3
    confirmed_hits: 1
    confirmed_window: 3
  fight:
    # per design doc: fight needs sustained signal across several clip
    # evaluations before CONFIRMED
    probable_hits: 2
    probable_window: 5
    confirmed_hits: 3
    confirmed_window: 5
  theft_probable:
    # theft is policy-capped at PROBABLE regardless of persistence -- see severity.py
    probable_hits: 1
    probable_window: 3
    confirmed_hits: 999           # effectively unreachable -> never auto-CONFIRMED
    confirmed_window: 3

severity:
  # base severity per event type; modifiers applied in severity/severity_rules.py
  base:
    fall: MEDIUM
    accident: HIGH
    crowd: LOW
    ppe_violation: LOW
    theft_probable: LOW
    fight: MEDIUM
  # event types that can never exceed this severity, no matter what (policy cap)
  hard_cap:
    theft_probable: MEDIUM
    suspicious_activity: LOW

evidence:
  output_dir: "output/evidence"
  raw_buffer_window_seconds: 15   # how much raw history is always kept in memory
  before_seconds: 5                # length of the "before" clip saved on confirm
  after_seconds: 5                 # length of the "after" clip captured post-confirm
  keyframe_count: 3
  clip_fps: 10                     # matches perception.detection_fps by default

fight_detection:
  enabled: true
  mode: model
  pose_model_path: "yolov8n-pose.pt"
  model_checkpoint: "models/fight_lstm_v2.pt"
  use_checkpoint_threshold: false
  gate:
    proximity_px: 300
    velocity_threshold_px_s: 30
  window_frames: 32
  min_frames_for_eval: 12
  confidence_threshold: 0.60
  gate_hold_seconds: 1.5
  pair_stale_after_s: 5.0