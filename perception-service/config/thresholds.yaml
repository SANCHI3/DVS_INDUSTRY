perception:
  model_path: "yolov8n.pt"       # COCO-pretrained; swap for a fine-tuned checkpoint later
  process_width: 640
  process_height: 480
  detection_fps: 10               # target for fight sequences; benchmark on deployment GPU
  confidence_threshold: 0.35
  classes_of_interest: ["person", "car", "truck", "backpack", "handbag", "suitcase"]

tracking:
  track_activation_threshold: 0.25
  lost_track_buffer: 30           # frames a track can be "lost" before removal
  minimum_matching_threshold: 0.8

temporal_buffer:
  window_seconds: 30              # rolling history kept per track

rules:
  crowd:
    person_count_threshold: 15         # people in one group before it counts as a crowd (site asks for 15-20)
    sustained_seconds: 5
  fall:
    aspect_ratio_flip_seconds: 1.5     # standing->fallen transition must happen within this
    stillness_seconds: 5                # time lying still before PROBABLE
    confirm_stillness_seconds: 8        # time lying still before CONFIRMED

confirmation:
  # number of positive evaluation windows out of the last N required per tier,
  # keyed by event_type. "default" applies to any event not explicitly listed.
  default:
    probable_hits: 2
    probable_window: 5
    confirmed_hits: 4
    confirmed_window: 5
  fall:
    probable_hits: 1
    probable_window: 3
    confirmed_hits: 1
    confirmed_window: 3
  fight:
    # per design doc: fight needs sustained signal across several clip
    # evaluations before CONFIRMED
    # RGB detector performs 2-of-3 inference-window persistence internally.
    # Once emitted here, confirm immediately; pipeline cycles without an RGB
    # evaluation must not count as model misses.
    probable_hits: 1
    probable_window: 1
    confirmed_hits: 1
    confirmed_window: 1
  fire_smoke:
    probable_hits: 1
    probable_window: 1
    confirmed_hits: 1
    confirmed_window: 1
  anomaly:
    # SceneAnomalyDetector applies its own N-of-M persistence and requests a tier
    probable_hits: 1
    probable_window: 1
    confirmed_hits: 1
    confirmed_window: 1
  theft_probable:
    # theft is policy-capped at PROBABLE regardless of persistence -- see severity.py
    probable_hits: 1
    probable_window: 3
    confirmed_hits: 999           # effectively unreachable -> never auto-CONFIRMED
    confirmed_window: 3

severity:
  # base severity per event type; modifiers applied in severity/severity_rules.py
  base:
    fall: MEDIUM
    accident: HIGH
    crowd: LOW
    ppe_violation: LOW
    theft_probable: LOW
    fight: MEDIUM
    fire_smoke: HIGH
    anomaly: LOW
  # event types that can never exceed this severity, no matter what (policy cap)
  hard_cap:
    theft_probable: MEDIUM
    suspicious_activity: LOW
    anomaly: MEDIUM               # unsupervised: the AI cannot name the event, a human must escalate

evidence:
  output_dir: "output/evidence"
  raw_buffer_window_seconds: 15   # how much raw history is always kept in memory
  before_seconds: 5                # length of the "before" clip saved on confirm
  after_seconds: 5                 # length of the "after" clip captured post-confirm
  keyframe_count: 3
  clip_fps: 10                     # matches perception.detection_fps by default

fight_detection:
  enabled: true
  # R3D-18 video classifier (temporal/rgb_action_recognition.py)
  gate:
    proximity_px: 300               # permissive compute trigger; classifier and confirmation reject false alerts
    velocity_threshold_px_s: 30     # opens early, then camera-level sequence preserves continuity
  gate_hold_seconds: 1.5            # continue evaluating briefly when gate flickers closed
  rgb:
    # v2: clips sampled at 10 fps of real time (matches detection_fps).
    # Live 2-of-3 rule on 344 test videos: P 0.94, R 0.97, F1 0.96 (v1: F1 0.85).
    # Thresholds from rgb_fight_model/calibrate_runtime.py (validation split);
    # see models/fight_r3d18_v2.runtime.json. v1 used probable 0.88 / confirmed 0.92.
    checkpoint: "models/fight_r3d18_v2.pt"
    clip_frames: 16
    evaluation_stride_frames: 4
    probable_threshold: 0.45        # operator "review" signal (training validation threshold)
    confirmed_threshold: 0.55       # alert threshold chosen on validation
    persistence_window: 3
    required_confirmed: 2
  interaction:
    # Track evidence required before a fight incident (temporal/interaction.py).
    # The R3D model scores whole clips and can fire on normal activity; a fight
    # also needs two distinct people, close together, moving in an agitated way.
    enabled: true
    active_track_seconds: 1.0       # ignore tracks not seen this recently (left / old IDs)
    duplicate_iou: 0.7              # two boxes this overlapped = one person tracked twice
    proximity_heights: 1.2          # centre distance <= 1.2 x mean body height counts as close
    min_interaction_seconds: 1.0    # close for at least this long ...
    lookback_seconds: 3.0           # ... within this window
    min_agitation_heights: 0.1      # erratic box motion + shape change / body height.
                                    # standing (detector jitter) ~0.02-0.05, walking ~0.01-0.04,
                                    # punching / shoving / grappling well above 0.1
    merged_hold_seconds: 2.0        # grappling people are often merged into one box

fire_smoke_detection:
  enabled: true
  checkpoint: "models/fire_smoke_yolov8n_v1.pt"
  imgsz: 640
  device: 0
  evaluation_stride_frames: 2
  fire_threshold: 0.50
  smoke_threshold: 0.50
  persistence_window: 5
  required_hits: 3
  # Fire + smoke together -> CONFIRMED at once. A single verified class
  # (e.g. flame with no visible smoke) is CONFIRMED after staying active this long.
  single_class_confirm_seconds: 3
  alarm_gap_seconds: 1.5            # a gap longer than this restarts the sustained timer
  # Suppress repeated bursts from the same ongoing camera-level incident.
  incident_dedup_seconds: 60
  verifier:
    # Second stage that rejects fire/smoke look-alikes.
    #   learned: gradient-boosting classifier on flicker, colour, texture and
    #            upward-motion features (fire_verifier/). Leave-one-video-out on
    #            FIRESENSE: fire false alarms 2 -> 0, fire F1 0.87 -> 0.95.
    #   rules:   hand-tuned flame colour / luminous core / flicker score
    #            (temporal/fire_verifier.py); fused = yolo_conf * ((1 - alpha) + alpha * verification)
    enabled: true
    mode: learned
    checkpoint: "models/fire_smoke_verifier_v1.pkl"
    alpha: 0.6               # rules mode only
  dynamics:
    # Static look-alike rejection (temporal/fire_dynamics.py). A persistent
    # fire/smoke box must change more than the rest of the scene: flames
    # flicker frame to frame, smoke drifts/grows over seconds. An orange
    # poster, a lamp, a grey wall or a window scores ~1 and is rejected.
    # Uses the frames already evaluated, so it adds no alarm delay.
    enabled: true
    min_ratio: 2.0                  # in-box change must be >= 2x the scene's median change
    noise_floor_gray: 1.0           # grey levels; stops a perfectly still scene dividing by ~0
    recent_frames: 5                # frames compared for flicker (= persistence_window)
    reference_min_age_seconds: 8    # smoke growth is measured against the scene this long ago
    reference_max_age_seconds: 30
    reference_interval_seconds: 1

fall_detection:
  # Pose-based fall detection. mode:
  #   gru       - temporal CNN + BiGRU on box + skeleton sequences (fall_gru/).
  #               5-fold grouped CV on 160 videos: P 0.86, R 0.94, F1 0.90, AUC 0.96
  #               (original box rule: F1 0.81 relaxed / 0.11 as deployed)
  #   model     - Random Forest on biomechanical features (fall_rf/); falls back
  #               to physics if its checkpoint is missing
  #   physics   - training-free biomechanical score
  #   bbox_rule - original aspect-ratio rule in temporal/rule_engine.py
  enabled: true
  mode: gru
  gru_checkpoint: "models/fall_gru_v1.pt"
  gru:                              # overrides for mode: gru
    pose_stride_frames: 1           # pose every processed frame while people are visible
    evaluation_stride_frames: 3
    persistence_window: 3
    required_hits: 2                # 2 of the last 3 evaluations above threshold
    cooldown_seconds: 30            # one incident per person per fall
    max_people_for_pose: 12
    verification:                   # temporal/fall_gru_recognition.py fall_plausibility()
      # A high model score is only raised as a fall when it is physically
      # plausible at that moment. Rejected checks are retried at the next
      # evaluation, so a fall still in progress passes once the person is down.
      enabled: true
      bottom_edge: 0.99             # box reaching the bottom edge with no torso found = cut off
      max_truncated_share: 0.8      # ... for >= 80% of the 4-s window = never fully in view
                                    # (close desk webcam): not judged. A real fall that ends at
                                    # the bottom edge passes, because the person was visible before.
                                    # The same share applies when no torso is found mid-frame
                                    # (sitting behind a desk or table).
      require_down: true            # torso tilted (or wide box without a skeleton) right now
    serious:                        # fallen person who does not get back up
      after_seconds: 20             # still down this long -> escalate the fall to CRITICAL
      recovered_after_seconds: 2    # upright (standing or sitting up) this long = got up
      max_unseen_seconds: 8         # person out of view longer than this -> stop watching
      upright_torso_tilt: 0.35      # torso tilt / 90 deg; <= 0.35 (~31 deg) counts as upright
      upright_box_aspect: 0.8       # without a skeleton: box width/height <= 0.8 = upright
  # --- settings below are for mode: model / physics ---
  checkpoint: "models/fall_rf_v1.joblib"
  pose_model_path: "yolov8n-pose.pt"
  use_checkpoint_threshold: true
  physics_threshold: 0.75
  window_seconds: 2.0
  idle_stride_frames: 3             # pose every 3rd cycle while nothing looks unusual
  evaluation_stride_frames: 2
  gate_hold_seconds: 4.0
  persistence_window: 3
  required_hits: 2
  confirm_still_seconds: 3.0        # still down this long after the fall -> CONFIRMED
  gate:
    height_drop_ratio: 0.20
    aspect_ratio: 0.90
    down_speed_heights_per_s: 0.5

scene_anomaly:
  # Unsupervised optical-flow autoencoder (anomaly/). Retrain on 20-60 min of
  # NORMAL footage from each camera:  python -m anomaly.train_autoencoder --normal <folder>
  enabled: true
  checkpoint: "models/scene_anomaly_ae_v2.npz"   # v2: event-grouped split, F1 0.79 / AUC 0.84
  # v3 (models/scene_anomaly_ae_v3_factory.npz) was trained on 6 min of this
  # factory's own footage (python -m anomaly.train_factory). On held-out factory
  # footage it raised more false alerts than v2, so v2 stays live until there
  # are 20-60 min of normal footage per camera (docs/RESULTS.md, section 7).
  evaluation_stride_frames: 2       # windows between evaluations (after resampling to model FPS)
  threshold_scale: 1.0              # >1 = fewer alerts, <1 = more sensitive
  persistence_window: 3
  required_hits: 2
  confirmed_ratio: 2.0              # error >= 2x threshold -> CONFIRMED
  cooldown_seconds: 30
  calibration:
    # The model's threshold comes from its TRAINING footage; on this camera
    # normal activity can exceed it all the time ("Unusual activity" every few
    # minutes). Observe this camera first, without alerting, and use the 99th
    # percentile of its normal windows as the camera threshold (never below the
    # model's). Saved to output/calibration/scene_anomaly_<camera>.json and
    # reused on restart. Run it while the scene is NORMAL; recalibrate after
    # moving the camera (delete the file or set recalibrate: true).
    enabled: true
    seconds: 300
    percentile: 99
    min_windows: 50
    dir: "output/calibration"
    recalibrate: false

incident_dedup:
  # One ongoing event = one incident. While an event keeps being detected for
  # the same camera, repeats update the open
  # incident instead of creating new ones. A new incident is raised only after
  # the event has been quiet for this many seconds.
  window_seconds: 60
  per_event_seconds:
    fight: 60
    crowd: 90
    fall: 45                        # must exceed fall_detection.gru.serious.after_seconds
    anomaly: 60
