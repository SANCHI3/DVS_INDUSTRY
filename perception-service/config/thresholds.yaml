perception:
  model_path: "yolov8n.pt"       # COCO-pretrained; swap for a fine-tuned checkpoint later
  process_width: 640
  process_height: 480
  detection_fps: 10               # target for fight sequences; benchmark on deployment GPU
  confidence_threshold: 0.35
  classes_of_interest: ["person", "car", "truck", "backpack", "handbag", "suitcase"]

tracking:
  track_activation_threshold: 0.25
  lost_track_buffer: 30           # frames a track can be "lost" before removal
  minimum_matching_threshold: 0.8

temporal_buffer:
  window_seconds: 30              # rolling history kept per track

rules:
  loitering:
    dwell_seconds: 10             # time in a zone before "loitering" candidate fires
  crowd:
    person_count_threshold: 4
    sustained_seconds: 5
  fall:
    aspect_ratio_flip_seconds: 1.5     # standing->fallen transition must happen within this
    stillness_seconds: 5                # time lying still before PROBABLE
    confirm_stillness_seconds: 8        # time lying still before CONFIRMED
  intrusion:
    min_frames_inside: 3          # frames of continuous presence before confirming (filters flicker)

confirmation:
  # number of positive evaluation windows out of the last N required per tier,
  # keyed by event_type. "default" applies to any event not explicitly listed.
  default:
    probable_hits: 2
    probable_window: 5
    confirmed_hits: 4
    confirmed_window: 5
  intrusion:
    probable_hits: 1
    probable_window: 3
    confirmed_hits: 1
    confirmed_window: 3
  fall:
    probable_hits: 1
    probable_window: 3
    confirmed_hits: 1
    confirmed_window: 3
  fight:
    # per design doc: fight needs sustained signal across several clip
    # evaluations before CONFIRMED, unlike geometry-based events like
    # intrusion which can confirm almost immediately
    # RGB detector performs 2-of-3 inference-window persistence internally.
    # Once emitted here, confirm immediately; pipeline cycles without an RGB
    # evaluation must not count as model misses.
    probable_hits: 1
    probable_window: 1
    confirmed_hits: 1
    confirmed_window: 1
  fire_smoke:
    probable_hits: 1
    probable_window: 1
    confirmed_hits: 1
    confirmed_window: 1
  anomaly:
    # SceneAnomalyDetector applies its own N-of-M persistence and requests a tier
    probable_hits: 1
    probable_window: 1
    confirmed_hits: 1
    confirmed_window: 1
  theft_probable:
    # theft is policy-capped at PROBABLE regardless of persistence -- see severity.py
    probable_hits: 1
    probable_window: 3
    confirmed_hits: 999           # effectively unreachable -> never auto-CONFIRMED
    confirmed_window: 3

severity:
  # base severity per event type; modifiers applied in severity/severity_rules.py
  base:
    fall: MEDIUM
    accident: HIGH
    intrusion: MEDIUM
    crowd: LOW
    loitering: LOW
    ppe_violation: LOW
    theft_probable: LOW
    fight: MEDIUM
    fire_smoke: HIGH
    anomaly: LOW
  # event types that can never exceed this severity, no matter what (policy cap)
  hard_cap:
    theft_probable: MEDIUM
    suspicious_activity: LOW
    anomaly: MEDIUM               # unsupervised: the AI cannot name the event, a human must escalate

evidence:
  output_dir: "output/evidence"
  raw_buffer_window_seconds: 15   # how much raw history is always kept in memory
  before_seconds: 5                # length of the "before" clip saved on confirm
  after_seconds: 5                 # length of the "after" clip captured post-confirm
  keyframe_count: 3
  clip_fps: 10                     # matches perception.detection_fps by default

fight_detection:
  enabled: true
  mode: rgb                  # primary RGB R3D-18 classifier; use "model" for pose-LSTM fallback
  pose_model_path: "yolov8n-pose.pt"
  model_checkpoint: "models/fight_lstm.pt"
  use_checkpoint_threshold: false # use stricter alert threshold below
  gate:
    proximity_px: 300               # permissive compute trigger; classifier and confirmation reject false alerts
    velocity_threshold_px_s: 30     # opens early, then camera-level sequence preserves continuity
  window_frames: 32                 # runtime value is replaced by checkpoint max_frames in model mode
  min_frames_for_eval: 12           # scene-level sequence now survives tracker ID switches
  confidence_threshold: 0.60        # balanced runtime starting point
  gate_hold_seconds: 1.5            # continue evaluating briefly when gate flickers closed
  pair_stale_after_s: 5.0           # pose-LSTM fallback setting
  rgb:
    checkpoint: "models/fight_r3d18_v1.pt"
    clip_frames: 16
    evaluation_stride_frames: 4
    probable_threshold: 0.88
    confirmed_threshold: 0.92
    persistence_window: 3
    required_confirmed: 2

fire_smoke_detection:
  enabled: true
  checkpoint: "models/fire_smoke_yolov8n_v1.pt"
  imgsz: 640
  device: 0
  evaluation_stride_frames: 2
  fire_threshold: 0.50
  smoke_threshold: 0.50
  persistence_window: 5
  required_hits: 3
  # Suppress repeated bursts from the same ongoing camera-level incident.
  incident_dedup_seconds: 60
  verifier:
    # Second stage that rejects fire/smoke look-alikes.
    #   learned: gradient-boosting classifier on flicker, colour, texture and
    #            upward-motion features (fire_verifier/). Leave-one-video-out on
    #            FIRESENSE: fire false alarms 2 -> 0, fire F1 0.87 -> 0.95.
    #   rules:   hand-tuned flame colour / luminous core / flicker score
    #            (temporal/fire_verifier.py); fused = yolo_conf * ((1 - alpha) + alpha * verification)
    enabled: true
    mode: learned
    checkpoint: "models/fire_smoke_verifier_v1.pkl"
    alpha: 0.6               # rules mode only

fall_detection:
  # Pose-based fall detection. mode:
  #   gru       - temporal CNN + BiGRU on box + skeleton sequences (fall_gru/).
  #               5-fold grouped CV on 160 videos: P 0.86, R 0.94, F1 0.90, AUC 0.96
  #               (original box rule: F1 0.81 relaxed / 0.11 as deployed)
  #   model     - Random Forest on biomechanical features (fall_rf/); falls back
  #               to physics if its checkpoint is missing
  #   physics   - training-free biomechanical score
  #   bbox_rule - original aspect-ratio rule in temporal/rule_engine.py
  enabled: true
  mode: gru
  gru_checkpoint: "models/fall_gru_v1.pt"
  gru:                              # overrides for mode: gru
    pose_stride_frames: 1           # pose every processed frame while people are visible
    evaluation_stride_frames: 3
    persistence_window: 3
    required_hits: 2                # 2 of the last 3 evaluations above threshold
    cooldown_seconds: 30            # one incident per person per fall
    max_people_for_pose: 12
  # --- settings below are for mode: model / physics ---
  checkpoint: "models/fall_rf_v1.joblib"
  pose_model_path: "yolov8n-pose.pt"
  use_checkpoint_threshold: true
  physics_threshold: 0.75
  window_seconds: 2.0
  idle_stride_frames: 3             # pose every 3rd cycle while nothing looks unusual
  evaluation_stride_frames: 2
  gate_hold_seconds: 4.0
  persistence_window: 3
  required_hits: 2
  confirm_still_seconds: 3.0        # still down this long after the fall -> CONFIRMED
  gate:
    height_drop_ratio: 0.20
    aspect_ratio: 0.90
    down_speed_heights_per_s: 0.5

scene_anomaly:
  # Unsupervised optical-flow autoencoder (anomaly/). Retrain on 20-60 min of
  # NORMAL footage from each camera:  python -m anomaly.train_autoencoder --normal <folder>
  enabled: true
  checkpoint: "models/scene_anomaly_ae_v2.npz"   # v2: event-grouped split, F1 0.79 / AUC 0.84
  evaluation_stride_frames: 2       # windows between evaluations (after resampling to model FPS)
  threshold_scale: 1.0              # >1 = fewer alerts, <1 = more sensitive
  persistence_window: 3
  required_hits: 2
  confirmed_ratio: 2.0              # error >= 2x threshold -> CONFIRMED
  cooldown_seconds: 30
