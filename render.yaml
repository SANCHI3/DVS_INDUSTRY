# Render Blueprint for the backend API (https://render.com/docs/blueprint-spec).
# The frontend is on Vercel (frontend/vercel.json) and forwards /api and
# /uploads here, so the browser only ever talks to one origin.
# The database is Neon PostgreSQL: paste its URLs when Render asks for them.
services:
  - type: web
    name: dvs-industry-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    # The root route answers without touching the database. Render calls this
    # every few seconds, so a database check here would keep Neon awake.
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: HUSKY
        value: "0"
      # Neon: pooled URL for the app, direct URL for migrations.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      # The CCTV PC's key (entered in the installer). At least 32 characters.
      - key: CAMERA_SERVICE_KEY
        generateValue: true
      # Vercel proxy + Render's load balancer.
      - key: TRUST_PROXY
        value: "2"
      # Comma-separated site URLs, e.g.
      # https://www.dvsindustry.online,https://dvsindustry.online,https://dvs-industry.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      # Outgoing mail: password-reset links and website inquiry notices.
      # Without SMTP_HOST neither email is sent.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: INQUIRY_NOTIFY_EMAIL
        sync: false
      # Incident pictures from the factory PC: kept in the database unless all
      # four EVIDENCE_S3_* are set (e.g. Cloudflare R2). Retention default 30 days.
      - key: EVIDENCE_S3_ENDPOINT
        sync: false
      - key: EVIDENCE_S3_BUCKET
        sync: false
      - key: EVIDENCE_S3_ACCESS_KEY_ID
        sync: false
      - key: EVIDENCE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: EVIDENCE_RETENTION_DAYS
        value: "30"
      # At least 16 characters; required in production.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: ASSISTANT_LLM_API_KEY
        sync: false
